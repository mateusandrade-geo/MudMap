name: MudMap

# Testa (dados reais + exemplo sintético), gera o executável do Windows e o pacote da skill do
# Claude. Numa tag v* (ex.: git tag v0.5.0 && git push --tags) publica tudo num Release.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes · Linux · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Bibliotecas do sistema para o Qt
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - name: Dependências
        run: pip install -r requirements.txt

      - name: Núcleo do app × pipeline (dados reais, sítio ativo)
        run: python app/testes/validar_nucleo.py
      - name: Interface sem tela (dados reais)
        run: python app/testes/testar_interface.py saida/ci/interface_real
      - name: Autoteste do app (dados reais)
        run: |
          st=0
          python app/run_studio.py --autoteste amostras/RJS0649RJ_1.1.mudmap saida/ci/autoteste.png . || st=$?
          cat saida/ci/autoteste.png.log
          exit $st

      - name: Exemplo sintético — fluxo dos scripts sem janela (como o Claude conduz)
        run: |
          python scripts/gerar_exemplo.py --sem-rotulos --destino exemplo_fluxo
          cd exemplo_fluxo
          python ../scripts/reconhecer.py
          python ../scripts/candidatos.py
          python ../scripts/segmentar.py --mineral quartzo --previa
          python ../scripts/segmentar.py --mineral quartzo --auto
          python ../scripts/segmentar.py --mineral pirita --auto
          python ../scripts/segmentar.py --mineral feldspato --auto
          python ../scripts/comparar.py --mineral quartzo --calibrar
          python ../scripts/revisar_commit.py --mineral feldspato
          python ../scripts/mapa_atual.py
          python ../scripts/exportar_graos.py
          python ../scripts/relatorio_final.py --previa
          python ../scripts/arquivar_sitio.py
          python ../scripts/exportar_mudmap.py
      - name: Exemplo sintético — núcleo e interface
        run: |
          python scripts/gerar_exemplo.py --destino exemplo_ref
          (cd exemplo_ref && python ../scripts/reconhecer.py)
          python app/testes/validar_nucleo.py exemplo_ref
          python app/testes/testar_interface.py saida/ci/interface_exemplo --raiz exemplo_ref
      - name: Troca de sítio (numa cópia do projeto)
        run: |
          mkdir -p "$RUNNER_TEMP/copia" && git archive HEAD | tar -x -C "$RUNNER_TEMP/copia"
          cd "$RUNNER_TEMP/copia"
          python scripts/ativar_sitio.py 1.1
          python scripts/ativar_sitio.py --listar
          python scripts/reconhecer.py
          python app/testes/validar_nucleo.py

      - uses: actions/upload-artifact@v4
        if: always() && matrix.python == '3.12'
        with:
          name: capturas-testes-linux
          path: |
            saida/ci/
            exemplo_fluxo/saida/
          retention-days: 14

  windows:
    name: Executável Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependências
        run: pip install -r requirements.txt pyinstaller
      - name: Gerar o executável
        shell: pwsh
        run: ./app/build_exe.ps1 -Python (Get-Command python).Source -Saida "$env:RUNNER_TEMP\mudmap" -Zip
      - name: Autoteste do executável (abre o .mudmap, edita, segmenta, relatório, exemplo, importa os TIFFs)
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\mudmap\dist\MudMapStudio\MudMapStudio.exe"
          $png = "$env:RUNNER_TEMP\autoteste\autoteste.png"
          New-Item -ItemType Directory -Force (Split-Path $png) | Out-Null
          $argumentos = @('--autoteste', "`"$PWD\amostras\RJS0649RJ_1.1.mudmap`"", "`"$png`"", "`"$PWD`"")
          $p = Start-Process -FilePath $exe -ArgumentList $argumentos -Wait -PassThru
          Get-Content "$png.log"
          if ($p.ExitCode -ne 0) { throw "autoteste do .exe falhou (código $($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: MudMapStudio-windows
          path: ${{ runner.temp }}/mudmap/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ runner.temp }}/mudmap/MudMapStudio-windows.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-autoteste-windows
          path: ${{ runner.temp }}/autoteste/
          retention-days: 14

  skill:
    name: Pacote da skill do Claude
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar MudMap-skill.zip (SKILL.md + scripts + app + config, sem os dados)
        run: |
          mkdir -p pacote/mudmap
          cp .claude/skills/mudmap/SKILL.md CLAUDE.md README.md requirements.txt requirements-napari.txt pacote/mudmap/
          cp -r scripts app config pacote/mudmap/
          rm -rf pacote/mudmap/app/testes pacote/mudmap/app/build_exe.ps1
          (cd pacote && zip -qr ../MudMap-skill.zip mudmap)
          unzip -l MudMap-skill.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: MudMap-skill
          path: pacote/
      - uses: actions/upload-artifact@v4
        with:
          name: release-skill
          path: MudMap-skill.zip
          retention-days: 7

  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [testes, windows, skill]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/MudMapStudio-windows.zip
            dist/MudMap-skill.zip
            amostras/*.mudmap
