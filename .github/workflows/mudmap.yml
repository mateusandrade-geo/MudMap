name: MudMap

# A cada push/PR: pytest + testes com os dados reais e com o exemplo sintético, fluxo dos scripts como o
# Claude conduz (só requirements-scripts.txt, sem Qt), .exe e instalador do Windows validados com --autoteste
# e o pacote da skill do Claude.
# Release: tag vX.Y.Z (= __version__ do app) OU Actions → MudMap → "Run workflow" com a versão preenchida.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      versao:
        description: "Publicar o Release desta versão (igual ao __version__ do app, ex.: 0.5.0). Vazio = só testar."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  versao:
    name: Versão e tamanho dos arquivos
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.v.outputs.versao }}
      publicar: ${{ steps.v.outputs.publicar }}
    steps:
      - uses: actions/checkout@v7
      - name: Versão do app × tag / versão pedida
        id: v
        env:
          PEDIDA: ${{ inputs.versao }}
        run: |
          v=$(python3 -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('app/mudmap_studio/__init__.py').read_text()).group(1))")
          echo "versao=$v" >> "$GITHUB_OUTPUT"
          pedida="${PEDIDA:-}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then pedida="${GITHUB_REF#refs/tags/v}"; fi
          if [[ -n "$pedida" ]]; then
            [[ "$pedida" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::versão '$pedida' não é X.Y.Z"; exit 1; }
            [[ "$pedida" == "$v" ]] || { echo "::error::versão pedida $pedida ≠ __version__ do app ($v): suba o __version__ antes"; exit 1; }
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          fi
          echo "versão do app: $v · publicar Release: ${pedida:-não}"
      - name: Nenhum arquivo versionado acima de 50 MB (o GitHub recusa > 100 MB; ver CONTRIBUTING.md)
        run: |
          python3 - <<'EOF'
          import os, subprocess, sys
          arqs = [f for f in subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0") if f and os.path.isfile(f)]
          grandes = [(f, os.path.getsize(f) / 2**20) for f in arqs if os.path.getsize(f) > 50 * 2**20]
          total = sum(os.path.getsize(f) for f in arqs) / 2**20
          print(f"{len(arqs)} arquivos, {total:.0f} MB no total")
          for f, mb in grandes:
              print(f"::error file={f}::{mb:.0f} MB — acima de 50 MB")
          sys.exit(1 if grandes else 0)
          EOF

  testes:
    name: Testes · Linux · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Bibliotecas do sistema para o Qt
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - name: Dependências (versões fixadas)
        run: pip install -r requirements.txt "pytest>=8"

      - name: Diagnóstico (ambiente e dados reais)
        run: python scripts/diagnostico.py
      - name: pytest
        run: python -m pytest
      - name: Núcleo do app × pipeline (dados reais, sítio ativo)
        run: python app/testes/validar_nucleo.py
      - name: Interface sem tela (dados reais)
        run: python app/testes/testar_interface.py saida/ci/interface_real
      - name: Autoteste do app (dados reais)
        run: |
          st=0
          python app/run_studio.py --autoteste saida/mudmap/RJS0649RJ_1.1.mudmap saida/ci/autoteste.png . || st=$?
          cat saida/ci/autoteste.png.log
          exit $st
      - name: Exemplo sintético — núcleo e interface
        run: |
          python scripts/gerar_exemplo.py --destino exemplo_ref
          (cd exemplo_ref && python ../scripts/reconhecer.py)
          python app/testes/validar_nucleo.py exemplo_ref
          python app/testes/testar_interface.py saida/ci/interface_exemplo --raiz exemplo_ref
      - name: Troca de sítio (numa cópia do projeto)
        run: |
          mkdir -p "$RUNNER_TEMP/copia" && git archive HEAD | tar -x -C "$RUNNER_TEMP/copia"
          cd "$RUNNER_TEMP/copia"
          python scripts/ativar_sitio.py 1.1
          python scripts/ativar_sitio.py --listar
          python scripts/diagnostico.py
          python app/testes/validar_nucleo.py         # inclui k-means = sitios/1.1/estado/clusters.npy

      - uses: actions/upload-artifact@v7
        if: always() && matrix.python == '3.12'
        with:
          name: capturas-testes-linux
          path: saida/ci/
          retention-days: 14

  claude:
    name: Fluxo do Claude · só scripts, sem Qt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dependências só do pipeline (requirements-scripts.txt)
        run: |
          pip install -r requirements-scripts.txt
          python -c "import importlib.util as u, sys; sys.exit(1 if u.find_spec('PyQt6') else 0)" || { echo "::error::PyQt6 instalado — o teste sem Qt não vale"; exit 1; }
      - name: Diagnóstico sem o app (PyQt6 ausente = só aviso)
        run: python scripts/diagnostico.py
      - name: Exemplo do zero — reconhecer → candidatos → segmentar → revisar → calibrar → resultados
        run: |
          python scripts/gerar_exemplo.py --sem-rotulos --destino exemplo_fluxo
          cd exemplo_fluxo
          python ../scripts/diagnostico.py
          python ../scripts/reconhecer.py
          python ../scripts/candidatos.py
          python ../scripts/segmentar.py --mineral quartzo --previa
          python ../scripts/segmentar.py --mineral quartzo --auto
          python ../scripts/segmentar.py --mineral pirita --auto
          python ../scripts/segmentar.py --mineral feldspato --auto
          python ../scripts/comparar.py --mineral quartzo --calibrar
          python ../scripts/revisar_commit.py --mineral feldspato
          python ../scripts/revisar_commit.py --mineral feldspato --remover "1"
          python -c "import numpy as np; r = np.load('estado/rotulos.npy'); np.save('estado/seg_seed_feldspato.npy', r == 12)"  # semente (no uso real: revisar_pontos.py)
          python ../scripts/propagar.py --mineral feldspato --previa
          python ../scripts/mapa_atual.py
          python ../scripts/exportar_graos.py
          python ../scripts/relatorio_final.py --previa --saida saida/relatorio_final_demo.png
          python ../scripts/arquivar_sitio.py
          python ../scripts/exportar_mudmap.py
          python ../scripts/diagnostico.py
      - name: Dados reais (sítio ativo 1.2, numa cópia) — prévia, comparação, relatório e pacote
        run: |
          mkdir -p "$RUNNER_TEMP/real" && git archive HEAD | tar -x -C "$RUNNER_TEMP/real"
          cd "$RUNNER_TEMP/real"
          python scripts/segmentar.py --mineral biotita --previa
          python scripts/comparar.py --mineral biotita
          python scripts/mapa_atual.py --base bse
          python scripts/relatorio_final.py --previa --saida saida/relatorio_final_ci.png
          python scripts/exportar_mudmap.py --saida "$RUNNER_TEMP/RJS0649RJ_1.2_ci.mudmap"
          python -c "import json,sys; a=json.load(open('saida/relatorio_final_ci.json')); b=json.load(open('saida/relatorio_final_1.2.json')); sys.exit(0 if a['fracoes_area']==b['fracoes_area'] and a['n_graos']==b['n_graos'] else 1)" || { echo "::error::relatório do 1.2 ≠ saida/relatorio_final_1.2.json versionado"; exit 1; }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: previas-fluxo-claude
          path: exemplo_fluxo/saida/
          retention-days: 14

  windows:
    name: Executável e instalador Windows
    needs: versao
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSAO: ${{ needs.versao.outputs.versao }}
      # assinatura só acontece se o certificado estiver nos secrets do repositório (ver README)
      TEM_CERTIFICADO: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dependências (versões fixadas + PyInstaller)
        run: pip install -r requirements-dev.txt
      - name: Gerar o executável
        shell: pwsh
        run: ./app/build_exe.ps1 -Python (Get-Command python).Source -Saida "$env:RUNNER_TEMP\mudmap"
      - name: Assinar o executável (só com certificado nos secrets)
        if: env.TEM_CERTIFICADO == 'true'
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_SENHA: ${{ secrets.WINDOWS_CERT_SENHA }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "certificado.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
          $exe = "$env:RUNNER_TEMP\mudmap\dist\MudMapStudio\MudMapStudio.exe"
          & $signtool.FullName sign /f $pfx /p $env:CERT_SENHA /fd sha256 /tr http://timestamp.digicert.com /td sha256 $exe
          $st = $LASTEXITCODE
          Remove-Item $pfx
          if ($st -ne 0) { throw "signtool falhou ($st)" }
          & $signtool.FullName verify /pa $exe
      - name: Licenças junto do executável e ZIP portátil
        shell: pwsh
        run: |
          $dist = "$env:RUNNER_TEMP\mudmap\dist\MudMapStudio"
          Copy-Item LICENSE, LICENSE-DADOS.md $dist
          Compress-Archive -Path $dist -DestinationPath "$env:RUNNER_TEMP\mudmap\MudMapStudio-windows.zip"
          (Get-Item "$dist\MudMapStudio.exe").VersionInfo | Format-List ProductName, FileDescription, FileVersion, ProductVersion
      - name: Autoteste do executável (abre o .mudmap, edita, segmenta, relatório, exemplo, importa os TIFFs)
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\mudmap\dist\MudMapStudio\MudMapStudio.exe"
          $png = "$env:RUNNER_TEMP\autoteste\portatil.png"
          New-Item -ItemType Directory -Force (Split-Path $png) | Out-Null
          $argumentos = @('--autoteste', "`"$PWD\saida\mudmap\RJS0649RJ_1.1.mudmap`"", "`"$png`"", "`"$PWD`"")
          $p = Start-Process -FilePath $exe -ArgumentList $argumentos -Wait -PassThru
          Get-Content "$png.log"
          if ($p.ExitCode -ne 0) { throw "autoteste do .exe falhou (código $($p.ExitCode))" }
      - name: Gerar o instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          Write-Output "ISCC: $($iscc.FullName)"
          & $iscc.FullName "/DVersao=$env:VERSAO" "/DOrigem=$env:RUNNER_TEMP\mudmap\dist\MudMapStudio" "/O$env:RUNNER_TEMP\mudmap" app\instalador\MudMapStudio.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou ($LASTEXITCODE)" }
      - name: Assinar o instalador (só com certificado nos secrets)
        if: env.TEM_CERTIFICADO == 'true'
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_SENHA: ${{ secrets.WINDOWS_CERT_SENHA }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "certificado.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:CERT_SENHA /fd sha256 /tr http://timestamp.digicert.com /td sha256 "$env:RUNNER_TEMP\mudmap\MudMapStudio-setup.exe"
          $st = $LASTEXITCODE
          Remove-Item $pfx
          if ($st -ne 0) { throw "signtool falhou ($st)" }
      - name: Instalar em silêncio, testar o app instalado e desinstalar
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\instalado"
          $p = Start-Process "$env:RUNNER_TEMP\mudmap\MudMapStudio-setup.exe" -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/TASKS="associar"', "/DIR=`"$dir`"")
          if ($p.ExitCode -ne 0) { throw "instalação falhou ($($p.ExitCode))" }
          $cmd = (Get-ItemProperty "HKCU:\Software\Classes\MudMap.Pacote\shell\open\command").'(default)'
          Write-Output "associação .mudmap: $cmd"
          if ($cmd -notlike "*$dir\MudMapStudio.exe*") { throw "associação .mudmap ausente" }
          if (-not (Test-Path "$dir\LICENSE")) { throw "LICENSE não instalado" }
          $png = "$env:RUNNER_TEMP\autoteste\instalado.png"
          $argumentos = @('--autoteste', "`"$PWD\saida\mudmap\RJS0649RJ_1.2.mudmap`"", "`"$png`"")
          $p = Start-Process -FilePath "$dir\MudMapStudio.exe" -ArgumentList $argumentos -Wait -PassThru
          Get-Content "$png.log"
          if ($p.ExitCode -ne 0) { throw "autoteste do app instalado falhou ($($p.ExitCode))" }
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          # o desinstalador roda uma cópia de si mesmo e retorna antes de terminar: esperar a remoção
          for ($i = 0; $i -lt 120 -and (Test-Path "$dir\MudMapStudio.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\MudMapStudio.exe") { throw "desinstalação deixou o executável" }
          if (Test-Path "HKCU:\Software\Classes\MudMap.Pacote") { throw "desinstalação deixou a associação .mudmap" }
          Write-Output "instalar → autoteste → desinstalar: OK"
      - uses: actions/upload-artifact@v7
        with:
          name: MudMapStudio-windows
          path: ${{ runner.temp }}/mudmap/dist/
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            ${{ runner.temp }}/mudmap/MudMapStudio-windows.zip
            ${{ runner.temp }}/mudmap/MudMapStudio-setup.exe
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capturas-autoteste-windows
          path: ${{ runner.temp }}/autoteste/
          retention-days: 14

  skill:
    name: Pacote da skill do Claude (claude.ai)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Montar MudMap-skill.zip (runbook /S_MudMap + scripts + app/nucleo + config, sem os dados)
        run: |
          mkdir -p pacote/mudmap
          # nome da skill no claude.ai: letras minúsculas/hífen
          sed 's/^name: S_MudMap$/name: mudmap/' .claude/skills/S_MudMap/SKILL.md > pacote/mudmap/SKILL.md
          cp CLAUDE.md README.md LICENSE LICENSE-DADOS.md CITATION.cff requirements*.txt pacote/mudmap/
          cp -r scripts app config pacote/mudmap/
          rm -rf pacote/mudmap/app/testes pacote/mudmap/app/instalador pacote/mudmap/app/build_exe.ps1 pacote/mudmap/app/versao_exe.py
          (cd pacote && zip -qr ../MudMap-skill.zip mudmap)
          unzip -l MudMap-skill.zip | tail -1
      - uses: actions/upload-artifact@v7
        with:
          name: MudMap-skill
          path: pacote/
      - uses: actions/upload-artifact@v7
        with:
          name: release-skill
          path: MudMap-skill.zip
          retention-days: 7

  release:
    name: Publicar Release
    if: needs.versao.outputs.publicar == 'true'
    needs: [versao, testes, claude, windows, skill]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.versao.outputs.versao }}
          target_commitish: ${{ github.sha }}
          name: MudMap ${{ needs.versao.outputs.versao }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            **MudMap Studio (Windows):** baixe `MudMapStudio-setup.exe` (instalador, sem pedir administrador; abre
            arquivos `.mudmap` com duplo clique) ou `MudMapStudio-windows.zip` (portátil: extrair e rodar
            `MudMapStudio\MudMapStudio.exe`). Na primeira vez, "Abrir o exemplo sintético" ou abra um dos pacotes
            `RJS0649RJ_*.mudmap` abaixo.

            **Com o Claude:** `MudMap-skill.zip` = skill para o claude.ai; no Claude Code, clone o repositório e
            use `/S_MudMap` (pipeline) e `/S_MudMapStudio` (software).

            Código sob MIT; dados da amostra RJS0649RJ sob CC BY 4.0 (ver `CITATION.cff`).
          files: |
            dist/MudMapStudio-setup.exe
            dist/MudMapStudio-windows.zip
            dist/MudMap-skill.zip
            saida/mudmap/*.mudmap
